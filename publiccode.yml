description:
  it:
    shortDescription: "EduWISP — DPC Android"
    longDescription: "Primo agente di EduWISP: agente Android open source in modalità device owner: applica policy, restrizioni, kiosk, aggiornamenti e fasce orarie anche offline. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è in fase di progettazione e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.org/docs/"
    documentation: "https://eduwisp.org/docs/"
    features:
      - "DPC Android"
  en:
    shortDescription: "EduWISP — Android DPC"
    longDescription: "Open-source Android agent running as device owner: enforces policies, restrictions, kiosk, updates and time slots, offline too. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in the design phase and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.org/docs/en/"
    documentation: "https://eduwisp.org/docs/en/"
    features:
      - "Android DPC"

